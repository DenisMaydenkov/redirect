:root{--bg:#f2f2f2;--fg:#000;--primary:#000;--on-primary:#f2f2f2;--secondary:#1b1b1b;--muted:#6a6a6a;--variant:#e2e2e2;--outline:#d0d0d0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f2;--primary:#f2f2f2;--on-primary:#000;--secondary:#e4e4e4;--muted:#8a8a8a;--variant:#1c1c1c;--outline:#2a2a2a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Instrument Sans",-apple-system,"Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom))}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto}
.edge{padding:0 23px}
.logo{display:block;height:40px;width:auto}
.logo path{fill:var(--fg)}
.icon{display:block;width:96px;height:96px;margin-top:40px}
.mono{display:grid;place-items:center;width:96px;height:96px;margin-top:40px;border-radius:22px;background:var(--variant);font-size:40px;font-weight:700}
.label{margin-top:24px;font-size:12px;letter-spacing:1px;color:var(--secondary)}
h1{margin:8px 0 0;font-size:40px;font-weight:700;letter-spacing:-1.8px;line-height:42px}
.lead{margin:10px 0 0;font-size:15px;line-height:1.4;color:var(--muted)}
.foot{margin-top:auto;padding:24px 23px 0;display:flex;flex-direction:column;gap:9px}
.pill{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:54px;border-radius:27px;border:0;font:inherit;font-size:17px;font-weight:500;text-decoration:none;cursor:pointer}
.pill.fill{background:var(--primary);color:var(--on-primary)}
.pill.line{background:none;border:1px solid var(--outline);color:var(--fg)}
.note{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--muted);text-align:center}
.note a{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:12px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
